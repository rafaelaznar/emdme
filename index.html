<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="emdme, a minimalist Markdown editor with style templates and Word export.">
  <title>emdme · Markdown studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" data-mode="split">
    <header class="app-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">¶</span>
        <span class="brand-name">emdme</span>
      </div>

      <button type="button" id="open-document" class="tool-btn" data-i18n-title="action.open" data-i18n-aria-label="action.open" title="Open" aria-label="Open">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 14l1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <button type="button" id="save-document" class="tool-btn" data-i18n-title="action.save" data-i18n-aria-label="action.save" title="Save" aria-label="Save">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3h2z"/><path d="M7 3v6h10V3M7 21v-7h10v7"/></svg>
      </button>
      <button type="button" id="save-as-document" class="tool-btn" data-i18n-title="action.saveAs" data-i18n-aria-label="action.saveAs" title="Save as" aria-label="Save as">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3h2z"/><path d="M7 3v6h10V3M7 21v-7h10v7M18 12v6M15 15h6"/></svg>
      </button>

      <button type="button" id="md-bold" class="tool-btn" data-i18n-title="action.bold" data-i18n-aria-label="action.bold" title="Bold" aria-label="Bold">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/></svg>
      </button>
      <button type="button" id="md-italic" class="tool-btn" data-i18n-title="action.italic" data-i18n-aria-label="action.italic" title="Italic" aria-label="Italic">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M19 4h-9"/><path d="M14 20H5"/><path d="M15 4L9 20"/></svg>
      </button>
      <button type="button" id="md-strike" class="tool-btn" data-i18n-title="action.strikethrough" data-i18n-aria-label="action.strikethrough" title="Strikethrough" aria-label="Strikethrough">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><path d="M4 12h16"/></svg>
      </button>
      <button type="button" id="md-heading" class="tool-btn" data-i18n-title="action.heading" data-i18n-aria-label="action.heading" title="Heading" aria-label="Heading">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="m17 12 3-2v8"/></svg>
      </button>
      <button type="button" id="md-code" class="tool-btn" data-i18n-title="action.inlineCode" data-i18n-aria-label="action.inlineCode" title="Code" aria-label="Code">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/></svg>
      </button>
      <button type="button" id="md-quote" class="tool-btn" data-i18n-title="action.blockquote" data-i18n-aria-label="action.blockquote" title="Quote" aria-label="Quote">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M17 6H3"/><path d="M21 12H8"/><path d="M21 18H8"/><path d="M3 12v6"/></svg>
      </button>
      <button type="button" id="md-link" class="tool-btn" data-i18n-title="action.link" data-i18n-aria-label="action.link" title="Link" aria-label="Link">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>

      <button type="button" id="list-unordered" class="tool-btn" data-i18n-title="action.listUnordered" data-i18n-aria-label="action.listUnordered" title="Bulleted list" aria-label="Bulleted list">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="4" cy="6" r="1.5"/><path d="M9 6h11"/><circle cx="4" cy="12" r="1.5"/><path d="M9 12h11"/><circle cx="4" cy="18" r="1.5"/><path d="M9 18h11"/></svg>
      </button>
      <button type="button" id="list-ordered" class="tool-btn" data-i18n-title="action.listOrdered" data-i18n-aria-label="action.listOrdered" title="Numbered list" aria-label="Numbered list">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="2.7" y="4.7" width="2.6" height="2.6" rx="0.5"/><path d="M9 6h11"/><rect x="2.7" y="10.7" width="2.6" height="2.6" rx="0.5"/><path d="M9 12h11"/><rect x="2.7" y="16.7" width="2.6" height="2.6" rx="0.5"/><path d="M9 18h11"/></svg>
      </button>
      <button type="button" id="smart-table" class="tool-btn" data-i18n-title="action.smartTable" data-i18n-aria-label="action.smartTable" title="Smart table" aria-label="Smart table">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 4v16M15 4v16"/></svg>
      </button>
      <button type="button" id="editor-font-decrease" class="tool-btn" data-i18n-title="action.fontDecrease" data-i18n-aria-label="action.fontDecrease" title="Decrease font size" aria-label="Decrease font size">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 19L9 6l5 13"/><path d="M6 14.5h6"/><path d="M17 8.5h5"/></svg>
      </button>
      <button type="button" id="editor-font-increase" class="tool-btn" data-i18n-title="action.fontIncrease" data-i18n-aria-label="action.fontIncrease" title="Increase font size" aria-label="Increase font size">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 19L9 6l5 13"/><path d="M6 14.5h6"/><path d="M17 8.5h5"/><path d="M19.5 6v5"/></svg>
      </button>

      <div class="app-bar-spacer"></div>

      <div class="segmented" role="group" data-i18n-aria-label="mode.group" aria-label="View mode">
        <button type="button" class="seg-btn is-active" data-mode="editor" data-i18n-title="mode.editor" title="Editor" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>
          <span data-i18n="mode.editor">Editor</span>
        </button>
        <button type="button" class="seg-btn" data-mode="split" data-i18n-title="mode.split" title="Split" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M12 4v16"/></svg>
          <span data-i18n="mode.split">Split</span>
        </button>
        <button type="button" class="seg-btn" data-mode="preview" data-i18n-title="mode.preview" title="Preview" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
          <span data-i18n="mode.preview">Preview</span>
        </button>
      </div>

      <label class="lang-select">
        <span class="visually-hidden" data-i18n="toolbar.language">Language</span>
        <select id="lang-select">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="val">Valencià</option>
        </select>
      </label>

      <button type="button" id="outline-toggle" class="tool-btn" data-i18n-title="toolbar.outline" data-i18n-aria-label="toolbar.outline" title="Contents" aria-expanded="false" aria-controls="outline-panel">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12h-8"/><path d="M21 6H8"/><path d="M21 18h-8"/><path d="M3 6v4c0 1.1.9 2 2 2h3"/><path d="M3 10v6c0 1.1.9 2 2 2h3"/></svg>
        <span data-i18n="toolbar.outline">Contents</span>
      </button>

      <button type="button" id="template-toggle" class="tool-btn" data-i18n-title="toolbar.template" title="Template" aria-expanded="false" aria-controls="template-panel">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg>
        <span data-i18n="toolbar.template">Template</span>
      </button>

      <button type="button" id="theme-toggle" class="tool-btn" data-i18n-title="toolbar.themeDark" title="Switch to dark theme" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <span data-i18n="toolbar.theme">Theme</span>
      </button>
    </header>

    <main class="workspace">
      <section class="pane pane-editor" data-i18n-aria-label="mode.editor" aria-label="Editor">
        <label class="visually-hidden" for="editor" data-i18n="editor.label">Markdown editor</label>
        <textarea id="editor" spellcheck="false" data-i18n-placeholder="editor.placeholder" placeholder="Write Markdown here…"></textarea>
      </section>

      <section class="pane pane-preview" data-i18n-aria-label="mode.preview" aria-label="Preview">
        <article id="preview" class="doc-preview"></article>
      </section>
    </main>

    <footer class="status-bar">
      <div class="status-group">
        <span class="status-item"><strong id="stat-words">0</strong> <span data-i18n="status.words">words</span></span>
        <span class="status-dot" aria-hidden="true">·</span>
        <span class="status-item"><strong id="stat-chars">0</strong> <span data-i18n="status.chars">characters</span></span>
        <span class="status-dot" aria-hidden="true">·</span>
        <span class="status-item"><strong id="stat-reading">0</strong> <span data-i18n="status.reading">min read</span></span>
      </div>
      <input class="status-file" id="stat-file" type="text" spellcheck="false" autocomplete="off" placeholder="—" readonly>
      <div class="status-group status-group-end">
        <span class="status-item status-template"><span data-i18n="status.template">Template</span>: <strong id="stat-template">Minimal</strong></span>
      </div>
    </footer>

    <div class="scrim" id="scrim" hidden></div>

    <aside class="panel" id="template-panel" aria-hidden="true" data-i18n-aria-label="panel.title" aria-label="Style template">
      <header class="panel-head">
        <h2 data-i18n="panel.title">Style template</h2>
        <button type="button" id="panel-close" class="icon-btn" data-i18n-title="panel.close" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="panel-body">
        <section class="field-group">
          <h3 data-i18n="panel.preset">Preset</h3>
          <div class="field">
            <select id="tpl-preset">
              <option value="minimal" data-i18n="preset.minimal">Minimal</option>
              <option value="report" data-i18n="preset.report">Report</option>
              <option value="book" data-i18n="preset.book">Book</option>
              <option value="modern" data-i18n="preset.modern">Modern</option>
              <option value="custom" data-i18n="preset.custom">Custom</option>
            </select>
          </div>
        </section>

        <section class="field-group">
          <h3 data-i18n="panel.typography">Body text</h3>
          <div class="field">
            <label for="tpl-body-font" data-i18n="panel.bodyFont">Font family</label>
            <select id="tpl-body-font"></select>
          </div>
          <div class="field">
            <label for="tpl-base-size" data-i18n="panel.baseSize">Base size <output id="out-base-size"></output></label>
            <input id="tpl-base-size" type="range" min="11" max="32" step="1">
          </div>
          <div class="field">
            <label for="tpl-line-height" data-i18n="panel.lineHeight">Line height <output id="out-line-height"></output></label>
            <input id="tpl-line-height" type="range" min="1" max="3" step="0.05">
          </div>
          <div class="field">
            <label for="tpl-para-spacing" data-i18n="panel.paraSpacing">Paragraph spacing <output id="out-para-spacing"></output></label>
            <input id="tpl-para-spacing" type="range" min="0" max="4" step="0.1">
          </div>
          <div class="field">
            <label for="tpl-align" data-i18n="panel.textAlign">Alignment</label>
            <select id="tpl-align">
              <option value="left" data-i18n="panel.alignLeft">Left</option>
              <option value="justify" data-i18n="panel.alignJustify">Justified</option>
            </select>
          </div>
          <div class="field field-inline">
            <label for="tpl-link-color" data-i18n="panel.linkColor">Link color</label>
            <input id="tpl-link-color" type="color">
          </div>
        </section>

        <section class="field-group">
          <h3 data-i18n="panel.headings">Headings</h3>
          <div class="field">
            <label for="tpl-heading-font" data-i18n="panel.headingFont">Font family</label>
            <select id="tpl-heading-font"></select>
          </div>
          <div class="field field-inline">
            <label for="tpl-heading-color" data-i18n="panel.headingColor">Color</label>
            <input id="tpl-heading-color" type="color">
          </div>
          <div class="field">
            <label for="tpl-heading-weight" data-i18n="panel.headingWeight">Weight <output id="out-heading-weight"></output></label>
            <input id="tpl-heading-weight" type="range" min="300" max="900" step="100">
          </div>
          <div class="field">
            <label for="tpl-heading-scale" data-i18n="panel.headingScale">Scale <output id="out-heading-scale"></output></label>
            <input id="tpl-heading-scale" type="range" min="0.6" max="2" step="0.05">
          </div>
          <div class="field">
            <label for="tpl-heading-case" data-i18n="panel.headingCase">Letter case</label>
            <select id="tpl-heading-case">
              <option value="normal" data-i18n="panel.caseNormal">Normal</option>
              <option value="uppercase" data-i18n="panel.caseUpper">Uppercase</option>
              <option value="small-caps" data-i18n="panel.caseSmallCaps">Small caps</option>
            </select>
          </div>
          <div class="field field-inline">
            <label for="tpl-number-headings" data-i18n="panel.numberHeadings">Number headings</label>
            <input id="tpl-number-headings" type="checkbox" class="switch">
          </div>
          <div class="field">
            <label for="tpl-number-depth" data-i18n="panel.numberDepth">Numbering depth <output id="out-number-depth"></output></label>
            <input id="tpl-number-depth" type="range" min="1" max="6" step="1">
          </div>
          <div class="field">
            <label for="tpl-number-style" data-i18n="panel.numberStyle">Numbering style</label>
            <select id="tpl-number-style">
              <option value="decimal">1, 1.1, 1.1.1</option>
              <option value="decimal-trailing">1., 1.1., 1.1.1.</option>
              <option value="paren">1), 1.1), 1.1.1)</option>
              <option value="outline">I, A, 1, a…</option>
            </select>
          </div>
        </section>

        <section class="field-group">
          <h3 data-i18n="panel.code">Code</h3>
          <div class="field">
            <label for="tpl-mono-font" data-i18n="panel.monoFont">Monospace font</label>
            <select id="tpl-mono-font"></select>
          </div>
          <div class="field field-inline">
            <label for="tpl-code-bg" data-i18n="panel.codeBg">Background</label>
            <input id="tpl-code-bg" type="color">
          </div>
        </section>

        <section class="field-group">
          <h3 data-i18n="panel.tables">Tables</h3>
          <div class="field field-inline">
            <label for="tpl-table-head-bg" data-i18n="panel.tableHeadBg">Header background</label>
            <input id="tpl-table-head-bg" type="color">
          </div>
          <div class="field field-inline">
            <label for="tpl-table-head-color" data-i18n="panel.tableHeadColor">Header text color</label>
            <input id="tpl-table-head-color" type="color">
          </div>
          <div class="field">
            <label for="tpl-table-head-weight" data-i18n="panel.tableHeadWeight">Header weight <output id="out-table-head-weight"></output></label>
            <input id="tpl-table-head-weight" type="range" min="300" max="900" step="100">
          </div>
          <div class="field">
            <label for="tpl-table-size" data-i18n="panel.tableSize">Text size <output id="out-table-size"></output></label>
            <input id="tpl-table-size" type="range" min="0.7" max="1.3" step="0.01">
          </div>
          <div class="field">
            <label for="tpl-table-padding" data-i18n="panel.tablePadding">Cell padding <output id="out-table-padding"></output></label>
            <input id="tpl-table-padding" type="range" min="0.2" max="1.4" step="0.05">
          </div>
        </section>

        <section class="field-group">
          <h3 data-i18n="panel.page">Page &amp; export</h3>
          <div class="field">
            <label for="tpl-page-size" data-i18n="panel.pageSize">Paper size</label>
            <select id="tpl-page-size">
              <option value="A4">A4</option>
              <option value="Letter">Letter</option>
            </select>
          </div>
          <div class="field">
            <label for="tpl-page-margin" data-i18n="panel.pageMargin">Margin <output id="out-page-margin"></output></label>
            <input id="tpl-page-margin" type="range" min="5" max="50" step="1">
          </div>
        </section>

        <section class="field-group">
          <button type="button" id="tpl-reset" class="ghost-btn" data-i18n="panel.reset">Reset template</button>
        </section>
      </div>

      <footer class="panel-foot">
        <button type="button" id="export-word" class="primary-btn" data-i18n="action.exportWord">Export to Word</button>
        <div class="panel-foot-row">
          <button type="button" id="export-html" class="ghost-btn" data-i18n="action.exportHtml">Export HTML</button>
          <button type="button" id="export-md" class="ghost-btn" data-i18n="action.exportMarkdown">Download .md</button>
        </div>
      </footer>
    </aside>

    <aside class="panel panel-left" id="outline-panel" aria-hidden="true" data-i18n-aria-label="outline.title" aria-label="Contents">
      <header class="panel-head">
        <h2 data-i18n="outline.title">Contents</h2>
        <button type="button" id="outline-close" class="icon-btn" data-i18n-title="panel.close" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="panel-body">
        <section class="field-group">
          <div class="field">
            <label for="outline-depth" data-i18n="outline.depth">Show up to level</label>
            <select id="outline-depth">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </div>
        </section>
        <nav id="outline-list" class="outline-list" data-i18n-aria-label="outline.title" aria-label="Contents"></nav>
      </div>
    </aside>

    <input id="open-file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
